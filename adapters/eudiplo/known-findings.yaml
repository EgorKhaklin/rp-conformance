# Known findings of EUDIPLO: FAILs that are reported upstream with evidence. The nightly job runs with
#   pnpm rp-conformance run --adapter eudiplo --known-findings adapters/eudiplo/known-findings.yaml
# and reports these FAILs as known findings (report.json, summary.md, junit.xml type "known-finding") without failing.
# Any other FAIL, an INCONCLUSIVE or REVIEW result, or a harness error fails it. Remove an entry once EUDIPLO fixes it;
# the run names a known finding whose test case passed.

- testCase: RP_WS_SM_Validity_005b_UF
  finding: >-
    EUDIPLO rejects an expired mdoc but fetches its status list first, against Token Status List section 8.3:
    @owf/mdoc IssuerAuth.verify runs verifyStatus before the validityInfo check
  reference: cre8/rp-conformance#4

# Found by the Phase 5 test cases against ghcr.io/eudiplo/eudiplo:main (9.1.0-main.ae0792a, 2026-11-17); not yet
# reported upstream.
- testCase: RP_WS_MS_ProtocolMessages_005
  flows: [dc-api]
  finding: >-
    The DC API request object carries a response_uri, which OpenID4VP 1.0 Appendix A.2 excludes for dc_api.jwt
- testCase: RP_WS_SM_IssuerIntegrity_013_UF
  finding: EUDIPLO accepts an SD-JWT VC whose vct is not among the vct_values of its query (OpenID4VP section 8.6, 14.9)
- testCase: RP_WS_SM_IssuerIntegrity_025_UF
  finding: EUDIPLO accepts an mdoc whose docType is not the doctype_value of its query (OpenID4VP section 8.6, B.2.3)
- testCase: RP_WS_SM_IssuerIntegrity_027_UF
  finding: >-
    EUDIPLO accepts an mdoc signed by a certificate without the document signer extended key usage 1.0.18013.5.1.2
    (ISO/IEC 18013-5 Annex B)
- testCase: RP_WS_SM_IssuerIntegrity_034a_UF
  finding: >-
    EUDIPLO accepts an SD-JWT VC whose signing certificate is issued by a certificate with basicConstraints cA false
    (RFC 5280 section 6.1.4)
- testCase: RP_WS_SM_IssuerIntegrity_037a_UF
  finding: >-
    EUDIPLO accepts an SD-JWT VC whose signing certificate carries an unknown extension marked critical (RFC 5280
    section 4.2)
- testCase: RP_Inf_SM_TrustMechanisms_002_UF
  finding: >-
    After retrieving a version of TL-PID whose seal does not verify, EUDIPLO rejects every PID ("trust_list_unavailable")
    instead of keeping the last valid version in use
- testCase: RP_Inf_SM_TrustMechanisms_003_UF
  finding: >-
    After retrieving a version of TL-PID sealed by another key, EUDIPLO rejects every PID ("trust_list_unavailable")
    instead of keeping the last valid version in use
- testCase: RP_Inf_SM_TrustMechanisms_006_UF
  finding: >-
    EUDIPLO uses a list whose LoTEType is that of a Wallet Providers list as TL-PID and accepts a PID of the entity it
    adds (ETSI TS 119 602, LoTEType)

# Found by the RP_WS_SH_Encoding, RP_PP_IA_Supportive and single-objective test cases (issue 32) against
# ghcr.io/eudiplo/eudiplo:main (9.1.0-main.ae0792a, 2026-11-19); not yet reported upstream. `evidence` names the file
# in the run's report directory that shows the finding.
- testCase: RP_WS_SH_Encoding_004_UF
  flows: [dc-api]
  finding: >-
    EUDIPLO answers an Authorization Response above its 10 MB body limit with HTTP 413 without the
    Access-Control-Allow-Origin header its other answers carry, and leaves the session active: the Relying Party's page
    sees only a network error, and the verification result never reports a failure
  evidence: >-
    artifacts/RP_WS_SH_Encoding_004_UF/dc-api/step-1/dc-api-run.json (network: the POST fails with net::ERR_FAILED;
    console: blocked by CORS policy) and step-1/rp-result.json (session active), run r20261119T231252-dc8385
