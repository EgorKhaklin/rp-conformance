# Implementation Conformance Statement of EUDIPLO as PID Provider (issuer test catalogue section 4), as the EUDIPLO
# issuer adapter configures ghcr.io/eudiplo/eudiplo:9.1.0. `profiles` are the profiles the answers select; `items` the
# declared values, keyed by ICS item or `<item>.<name>` (IssuerIcs). "live" marks a value checked against the running
# 9.1.0 by the adapter's integration test or by a call to its API; "source" one read from the v9.1.0 tag of EUDIPLO
# (apps/backend/src/...) that only an issuance can show, which the issuance client of issue 15 confirms in issue 17.
profiles:
  - P-PID   # ICS-01
  - P-SD    # ICS-02
  - P-PA    # ICS-03
  - P-DB    # ICS-04
  - P-REV   # ICS-05
  - P-SUSP  # ICS-05
  - P-HOOK  # ICS-06
  - P-BATCH # ICS-08
  - P-REISS # ICS-09
  - P-NOT   # ICS-11
  - P-ENC   # ICS-12
  - P-DPN   # ICS-13: the nonce endpoint only, no DPoP server nonce (ICS-13.dpop_nonce)

items:
  ICS-01: PID Provider                       # entity PP-T on TL-PID; PID Rulebook
  ICS-02: SD-JWT VC                          # live: pid-sd-jwt-vc, format dc+sd-jwt, vct urn:eudi:pid:1. EUDIPLO issues mso_mdoc too; the adapter configures no mdoc PID (PID_02 not met, README)
  ICS-02.SD: pid-sd-jwt-vc                   # the configuration that issues the PID in SD-JWT VC, as definitions name it (ICS-02.<format variant>)
  ICS-03: pre-authorized code              # live: flow pre_authorized_code at the built-in authorization server, with and without tx_code. No P-AC: no authenticateSubject (README)
  ICS-03.tx_code: with and without           # live: tx_code of 6 digits, input_mode numeric; txCodeMaxAttempts default 5
  ICS-03.subject_authentication: none        # the built-in authorization server issues codes without a login step (docs issuance/authorization-servers.md)
  ICS-04: device-bound                       # live: keyBinding true, cryptographic_binding_methods_supported jwk
  ICS-04.key_storage: [iso_18045_high]       # live: keyAttestationsRequired, published as key_attestations_required
  ICS-04.user_authentication: [iso_18045_high]
  ICS-05: Token Status List                  # live: statusManagement true. JWT, and CWT for Accept application/statuslist+cwt (docs issuance/revocation.md; a token exists only once a credential is issued)
  ICS-05.token_formats: [jwt, cwt]           # source: status-list.controller.ts answers Accept application/statuslist+cwt with a CWT, anything else with a JWT (issue 22, sl-media-type)
  ICS-05.short_lived: "No"                   # lifeTime 30 days
  ICS-05.identifier_list: "No"               # source: EUDIPLO reads identifier lists as verifier (trust/status-list-verifier.service.ts) but publishes none
  ICS-05.suspension: "Yes"                   # live: status list bits 2 (PUT /api/status-list-config); status 2 = suspended
  ICS-06: revoke, suspend, unsuspend         # setStatus: POST /api/session/revoke, confirmed by GET /api/session/{id}/credential-status. A revoked credential cannot be changed again (409)
  ICS-06.change_subject: "No"                # no changeSubject: EUDIPLO keeps no subject record to change; claims travel with each offer
  ICS-06.user_revocation_request: "No"
  ICS-06.T_rev: PT1M                         # live: immediateUpdate true re-signs the list on every change; ttl 60 s, the minimum PUT /api/status-list-config accepts ("greater than or equal to 60")
  ICS-07: "No"                               # live: POST /api/issuer/credentials rejects revokeWithWalletUnit as unrecognized_keys (added after 9.1.0, EUDIPLO/eudiplo#1468)
  ICS-07.T_chain: none
  ICS-08: "Yes"                              # batchSize below
  ICS-08.batch_size: 2                       # live: issuance configuration batchSize 2, published as batch_credential_issuance.batch_size (a maximum: one proof still gives one credential)
  ICS-08.credential_reuse_policy: none       # config.credentialReusePolicy not set
  ICS-09: "Yes"                              # source: built-in token.refreshTokenEnabled default true (token-grant-rules.ts), refresh tokens bound to the DPoP key
  ICS-10: "No"                               # deferred issuance needs an attribute provider or webhook that defers; the adapter configures none
  ICS-11: "Yes"                              # live: notificationEndpointEnabled true, notification_endpoint in the metadata
  ICS-12: "Yes"                              # live: credential_request_encryption and credential_response_encryption advertised, encryption_required false
  ICS-13.dpop_nonce: "No"                    # source: no DPoP-Nonce / use_dpop_nonce anywhere in apps/backend/src of 9.1.0
  ICS-13.nonce_endpoint: "Yes"               # live: nonce_endpoint in the metadata
  ICS-13.dpop_required: "Yes"                # live: dPopRequired true
  ICS-14.T_proof: PT10M                      # source: proofs are bound by c_nonce only, which lives 10 minutes (nonce.service.ts); above the 5 minute cap of the catalogue (README)
  ICS-14.T_skew: PT5S                        # source: CRYPTO_TOLERANCE default 5 s
  ICS-14.pre_authorized_code: PT24H          # offerLifetimeSeconds not set: the code lives as long as the session, SESSION_TTL default 86400 s
  ICS-14.c_nonce: PT10M                      # source: nonce.service.ts expiresAt now + 10 min
  ICS-14.access_token: PT5M                  # source: ACCESS_TOKEN_LIFETIME_SECONDS 300 (token-grant-rules.ts)
  ICS-15.T_refresh: PT5M                     # source: trust-store.service.ts cacheTtlMs 5 min; refreshTrust clears the cache (DELETE /api/cache/trust-list, live)
  ICS-15.next_update_grace: not enforced     # source: 9.1.0 reads NextUpdate but keeps using an outdated list (enforced after 9.1.0, EUDIPLO/eudiplo#1441)
  ICS-16.min_entries: 10000                  # live: status list capacity 10000 (STATUS_CAPACITY default, set explicitly)
  ICS-16.timestamp_precision: PT1H           # source: issuance and expiry times rounded to the hour (credential-time.util.ts)
  ICS-17: seeds SUBJ-1 and SUBJ-2            # claims inline with each offer (credentialClaims, src/subjects.ts)
  ICS-17.portrait_opt_out: "No"              # the SD-JWT VC PID configuration has no portrait
  ICS-18: accept                             # source: 9.1.0 accepts a WIA whose status list cannot be fetched (wallet-attestation.service.ts, "status checking is optional") and checks no KA status; not configurable before EUDIPLO/eudiplo#1340. A PID Provider must reject (decision 2): README
  ICS-19: "No"                               # embeddedDisclosurePolicy not set
