# Implementation Conformance Statement of EUDIPLO as PID Provider and, under `categories` (issue 27), as Attestation
# Provider (issuer test catalogue section 4), as the EUDIPLO issuer adapter configures the reference image pinned in
# reference.env (main image 9.1.0-main.ae0792a, by digest).
# `profiles` are the profiles the answers select; `items` the declared values, keyed by ICS item or `<item>.<name>`
# (IssuerIcs). "live" marks a value checked against the running pinned image by the adapter's integration test or by a
# call to its API; "source" one read from EUDIPLO at revision ae0792a (apps/backend/src/..., apps/docs/docs/...) that
# only an issuance can show, which the issuance client confirms in issue 17.
profiles:
  - P-PID   # ICS-01
  - P-SD    # ICS-02
  - P-MD    # ICS-02
  - P-PA    # ICS-03
  - P-AC    # ICS-03: built-in authorization server, PAR + PKCE S256; authenticateSubject follows its redirect (no login, ICS-03.subject_authentication)
  - P-DB    # ICS-04
  - P-REV   # ICS-05
  - P-SHORT # ICS-05: the short-lived configurations ICS-05.short.SD and ICS-05.short.MD
  - P-SUSP  # ICS-05
  - P-HOOK  # ICS-06
  - P-CHAIN # ICS-07
  - P-BATCH # ICS-08
  - P-REISS # ICS-09
  - P-DEF   # ICS-10
  - P-NOT   # ICS-11
  - P-ENC   # ICS-12
  - P-DPN   # ICS-13: the nonce endpoint only, no DPoP server nonce (ICS-13.dpop_nonce)

items:
  ICS-01: PID Provider                       # entity PP-T on TL-PID; PID Rulebook
  ICS-02: SD-JWT VC and mdoc                 # live: pid-sd-jwt-vc (dc+sd-jwt, vct urn:eudi:pid:1) and pid-mso-mdoc (mso_mdoc, doctype eu.europa.ec.eudi.pid.1)
  ICS-02.SD: pid-sd-jwt-vc                   # the configuration that issues the PID in SD-JWT VC, as definitions name it (ICS-02.<format variant>)
  ICS-02.MD: pid-mso-mdoc                    # the configuration that issues the PID in mdoc, signed by the document signer the Registrar issued
  ICS-02.second: pid-sd-jwt-vc-2               # a second SD-JWT VC configuration (issue 24's, never in a PID offer), offered on its own by PP_WS_IA_PreAuthorized_004_UF
  ICS-03: pre-authorized code, authorization code  # live: flows pre_authorized_code (with and without tx_code) and authorization_code (issuer_state) at the built-in authorization server
  ICS-03.tx_code: with and without           # live: tx_code of 6 digits, input_mode numeric; txCodeMaxAttempts default 5
  ICS-03.subject_authentication: none        # the built-in authorization server issues codes without a login step (docs issuance/authorization-servers.md): authenticateSubject opens the authorization request and returns EUDIPLO's redirect; the subject is the one of the offer (issuer_state)
  ICS-03.par_request_uri_lifetime: PT60S     # source: PAR_REQUEST_URI_LIFETIME_SECONDS 60 (pushed-authorization-request.ts), expires_in of the PAR response
  ICS-03.authorization_code_lifetime: PT60S  # source: AUTHORIZATION_CODE_LIFETIME_SECONDS 60
  ICS-04: device-bound                       # live: keyBinding true, cryptographic_binding_methods_supported jwk
  ICS-04.key_storage: [iso_18045_high]       # live: keyAttestationsRequired, published as key_attestations_required
  ICS-04.user_authentication: [iso_18045_high]
  ICS-05: Token Status List                  # live: statusManagement true. JWT, and CWT for Accept application/statuslist+cwt (docs issuance/revocation.md; a token exists only once a credential is issued)
  ICS-05.token_formats: [jwt, cwt]           # source: status-list.controller.ts answers Accept application/statuslist+cwt with a CWT, anything else with a JWT (issue 22, sl-media-type)
  ICS-05.short_lived: "Yes"                  # the PID configurations live 30 days with a status reference; the short-lived ones 12 hours without
  ICS-05.short.SD: pid-sd-jwt-vc-short       # short-lived PID in SD-JWT VC: statusManagement false, lifeTime 12 h (SM_Validity_002)
  ICS-05.short.MD: pid-mso-mdoc-short        # short-lived PID in mdoc: statusManagement false, lifeTime 12 h
  ICS-05.validity_period: P30D               # lifeTime of ICS-02.SD and ICS-02.MD (SM_Validity_004); EUDIPLO rounds iat down and exp up to the hour (ICS-16.timestamp_precision)
  ICS-05.short.validity_period: PT12H        # lifeTime of ICS-05.short.SD and ICS-05.short.MD
  ICS-05.identifier_list: "No"               # source: EUDIPLO reads identifier lists as verifier (trust/status-list-verifier.service.ts) but publishes none
  ICS-05.suspension: "Yes"                   # live: status list bits 2 (PUT /api/status-list-config); status 2 = suspended
  ICS-06: revoke, suspend, unsuspend         # setStatus: POST /api/session/revoke, confirmed by GET /api/session/{id}/credential-status. A revoked credential cannot be changed again (409)
  ICS-06.change_subject: "Yes"               # issue 26: EUDIPLO keeps no subject record (claims travel with each offer); the adapter plays the back office: changeSubject revokes every session of the subject and later offers carry the new data
  ICS-06.user_revocation_request: "No"
  ICS-06.T_rev: PT1M                         # live: immediateUpdate true re-signs the list on every change; ttl 60 s, the minimum PUT /api/status-list-config accepts (">=60")
  ICS-07: "Yes"                              # live: revokeWithWalletUnit true on pid-sd-jwt-vc (read back by GET /api/issuer/credentials/{id}); EUDIPLO follows the key attestation's status list and revokes the PID when it says revoked (1); suspended (2) changes nothing (docs trust/attestation.md)
  ICS-07.T_chain: PT7M                       # 30 s WALLET_UNIT_STATUS_CHECK_INTERVAL (adapters/eudiplo/docker-compose.yml, live in the container) + reuse of SL-WP-A for its ttl 300 s (harness default; EUDIPLO reuses a list for its ttl, at most 1 h) + T_rev 60 s = 390 s, rounded up
  ICS-08: "Yes"                              # batchSize below
  ICS-08.batch_size: 2                       # live: issuance configuration batchSize 2, published as batch_credential_issuance.batch_size (a maximum: one proof still gives one credential)
  ICS-08.credential_reuse_policy: once_only, limited_time  # config.credentialReusePolicy arf_annex_ii: method A with batch_size 2, then method B (issue 24)
  ICS-09: "Yes"                              # source: built-in token.refreshTokenEnabled default true (token-grant-rules.ts), refresh tokens bound to the DPoP key
  ICS-10: "Yes"                              # live: offers with deferred: true take their claims from the adapter's webhook, which answers {deferred: true}; EUDIPLO answers 202 with transaction_id and interval, the adapter completes it (POST /api/issuer/deferred/{id}/complete). Inline claims never defer
  ICS-11: "Yes"                              # live: notificationEndpointEnabled true, notification_endpoint in the metadata
  ICS-12: "Yes"                              # live: credential_request_encryption and credential_response_encryption advertised, encryption_required false
  ICS-13.dpop_nonce: "No"                    # source: no DPoP-Nonce / use_dpop_nonce anywhere in apps/backend/src
  ICS-13.nonce_endpoint: "Yes"               # live: nonce_endpoint in the metadata
  ICS-13.dpop_required: "Yes"                # live: dPopRequired true
  ICS-14.T_proof: not bounded                # source: a proof's iat is checked only against the future (skew); its age only through c_nonce, which lives 10 minutes (nonce.service.ts). Above the 5 minute cap of the catalogue: README
  ICS-14.T_skew: PT5S                        # source: CRYPTO_TOLERANCE default 5 s
  ICS-14.pre_authorized_code: PT24H          # offerLifetimeSeconds not set: the code lives as long as the session, SESSION_TTL default 86400 s
  ICS-14.c_nonce: PT10M                      # source: nonce.service.ts expiresAt now + 10 min
  ICS-14.access_token: PT1M                  # live: the adapter sets token.lifetimeSeconds 60 (EUDIPLO's minimum) on the built-in authorization server; expires_in 60 in the token response
  ICS-15.T_refresh: PT5M                     # source: trust-store.service.ts cacheTtlMs 5 min; refreshTrust clears the cache (DELETE /api/cache/trust-list, live)
  ICS-15.next_update_grace: PT0S             # source: a list whose NextUpdate has passed is discarded at once, also as wallet provider list, and so is one with a lower LoTESequenceNumber than one accepted before (docs trust/trust-lists.md, EUDIPLO/eudiplo#1441, #1457)
  ICS-16.min_entries: 10000                  # live: status list capacity 10000 (STATUS_CAPACITY default, set explicitly)
  ICS-16.timestamp_precision: PT1H           # source: issuance and expiry times rounded to the hour (credential-time.util.ts)
  ICS-17: seeds SUBJ-1 and SUBJ-2            # claims inline with each offer (credentialClaims, src/subjects.ts)
  ICS-17.portrait_opt_out: "No"              # the PID configurations have no portrait; inline claims cannot carry the empty bstr an mdoc needs (DM_Portrait_001 NOT APPLICABLE)
  ICS-18: reject                             # live: walletAttestationStatusCheckMode strict (read back by GET /api/issuer/config): a WIA or KA whose status list cannot be fetched, is unreadable, expired, or signed by another key is rejected (docs trust/attestation.md). As decision 2 requires of a PID Provider
  ICS-19: "No"                               # embeddedDisclosurePolicy not set

# Issue 27: EUDIPLO as Attestation Provider. One tenant per category, each a Provider instance of its own, enrolled by
# the Test Registrar as QP-T (TL-QEAA, granted qualified EAA service), PB-T (TL-PUB) or EP-T (rulebook anchor CA-EP-T),
# issuing FCAF default_credential_A (vct urn:rp-conformance:credential_a:1, doctype test.rp-conformance.credential_a.1).
# Each entry is the ICS of that instance: its profiles, and the items that differ from the PID Provider's above (the
# others are the same, since the adapter configures every tenant alike). The runner executes the AP_* test cases of a
# category against its instance, the categories in parallel.
categories:
  Q:
    profiles: [P-Q, P-SD, P-MD, P-PA, P-AC, P-DB, P-NDB, P-REV, P-SHORT, P-SUSP, P-HOOK, P-CHAIN, P-BATCH, P-REISS, P-DEF, P-NOT, P-ENC, P-DPN, P-EDP]
    items:
      ICS-01: QEAA Provider                    # entity QP-T, granted EAA/Q service on TL-QEAA; rulebook FCAF default_credential_A
      ICS-02: SD-JWT VC and mdoc
      ICS-02.SD: qeaa-sd-jwt-vc                # default_credential_A, device-bound, 30 days with a status reference
      ICS-02.MD: qeaa-mso-mdoc
      ICS-02.second: qeaa-sd-jwt-vc-2
      ICS-04: device-bound and not device-bound
      ICS-04.NDB.SD: qeaa-sd-jwt-vc-ndb        # keyBinding false: no cryptographic binding, no proof type (P-NDB)
      ICS-04.key_storage: [iso_18045_moderate, iso_18045_high]   # keyAttestationsRequired of the device-bound configurations
      ICS-04.user_authentication: [iso_18045_moderate, iso_18045_high]
      ICS-05.short.SD: qeaa-sd-jwt-vc-short
      ICS-05.short.MD: qeaa-mso-mdoc-short
      ICS-07: "Yes"                            # revokeWithWalletUnit true on the device-bound configurations with status (WURevocation_19)
      ICS-17: seeds SUBJ-1 and SUBJ-2          # default_credential_A claims inline with each offer (ATTESTATION_TEST_SUBJECTS)
      ICS-18: reject                           # walletAttestationStatusCheckMode strict
      ICS-19: "Yes"                            # embeddedDisclosurePolicy allowList [https://rp.rp-test] on every configuration, published as disclosure_policy; changeDisclosurePolicy PATCHes another relying party
  PB:
    profiles: [P-PB, P-SD, P-MD, P-PA, P-AC, P-DB, P-NDB, P-REV, P-SHORT, P-SUSP, P-HOOK, P-CHAIN, P-BATCH, P-REISS, P-DEF, P-NOT, P-ENC, P-DPN]
    items:
      ICS-01: PuB-EAA Provider                 # entity PB-T on TL-PUB; rulebook FCAF default_credential_A
      ICS-02: SD-JWT VC and mdoc
      ICS-02.SD: pub-eaa-sd-jwt-vc
      ICS-02.MD: pub-eaa-mso-mdoc
      ICS-02.second: pub-eaa-sd-jwt-vc-2
      ICS-04: device-bound and not device-bound
      ICS-04.NDB.SD: pub-eaa-sd-jwt-vc-ndb
      ICS-04.key_storage: [iso_18045_moderate, iso_18045_high]
      ICS-04.user_authentication: [iso_18045_moderate, iso_18045_high]
      ICS-05.short.SD: pub-eaa-sd-jwt-vc-short
      ICS-05.short.MD: pub-eaa-mso-mdoc-short
      ICS-07: "Yes"
      ICS-17: seeds SUBJ-1 and SUBJ-2
      ICS-18: reject
  E:
    profiles: [P-E, P-SD, P-MD, P-PA, P-AC, P-DB, P-NDB, P-REV, P-SHORT, P-SUSP, P-HOOK, P-BATCH, P-REISS, P-DEF, P-NOT, P-ENC, P-DPN]
    items:
      ICS-01: non-qualified EAA Provider       # entity EP-T under the rulebook anchor CA-EP-T (TA-EAA); rulebook FCAF default_credential_A
      ICS-02: SD-JWT VC and mdoc
      ICS-02.SD: eaa-sd-jwt-vc
      ICS-02.MD: eaa-mso-mdoc
      ICS-02.second: eaa-sd-jwt-vc-2
      ICS-04: device-bound and not device-bound
      ICS-04.NDB.SD: eaa-sd-jwt-vc-ndb
      ICS-04.key_storage: [iso_18045_moderate, iso_18045_high]
      ICS-04.user_authentication: [iso_18045_moderate, iso_18045_high]
      ICS-05.short.SD: eaa-sd-jwt-vc-short
      ICS-05.short.MD: eaa-mso-mdoc-short
      ICS-07: "No"                             # revokeWithWalletUnit false: this instance does not chain (WURevocation_19 leaves it to the Provider)
      ICS-17: seeds SUBJ-1 and SUBJ-2
      ICS-18: reject
