# Known findings of EUDIPLO as PID Provider: FAILs of the issuer suite that are reported upstream with evidence. The
# reference run against the pinned EUDIPLO image (issuer harness design section 5.5) reports these FAILs as known
# findings and marks their test cases "not validated" until EUDIPLO is fixed; any other FAIL, an INCONCLUSIVE or REVIEW
# result, or a harness error fails it. Each entry names the test case, the finding and the upstream reference:
#
# - testCase: PP_WS_SM_ClientAttestation_013_UF
#   variants: [SD+PA]   # optional, as the report names the variant; default every variant
#   finding: >-
#     ...
#   reference: EUDIPLO/eudiplo#<n>
#   basis: profile      # confirmed: a requirement of the base specification; profile: of the EUDI profile only
#
# Remove an entry once EUDIPLO fixes it; the run names a known finding whose test case passed. The README lists the FAILs
# expected against the pinned reference image (reference.env).

# Spec review of 2026-11-20: every finding was checked against the primary specifications and EUDIPLO's source at
# ae0792a. Only confirmed findings (`basis: confirmed`, a requirement of the specification EUDIPLO implements) and
# findings against the EUDI profile only (`basis: profile`: ARF, TS3, PID Rulebook; EUDIPLO conforms to the base
# specification) remain. Findings whose test was wrong are gone with their tests corrected; findings without a MUST are
# no longer FAILs (INFO or POLICY), and the texts kept for them are suggestions in upstream-findings/suggestions/.
# All findings were reported upstream on 2026-11-21 and 2026-11-22 (EUDIPLO/eudiplo#1618 to #1626) and fixed on EUDIPLO's
# main, which is the reference image since 2026-11-23 (reference.env: 10.0.0-main.7586139). The full issuer suite against
# it passes except for the entry below; the fixed entries are removed (git history and upstream-findings/README.md).

# --- Attestation Provider variants (issue 27) ------------------------------------------------------------------------

# EUDIPLO/eudiplo#1622 (fixed by EUDIPLO/eudiplo#1634) bounds the expiry by the WIA's and KA's maintenance period only
# for configurations with revokeWithWalletUnit: TS3 1.5 section 2.4.3 states the rule for the PID, and an Attestation
# Provider that does not chain revocation chooses the validity itself. The non-qualified EAA tenant does not chain
# (ICS-07 No), so its variant still fails; the PID Provider and the chaining QEAA and PuB-EAA tenants pass. For an
# Attestation Provider the bound is tested by AP_WS_SM_Revocation_101 (ISSU_12d, P-CHAIN only), which passes.
- testCase: AP_WS_SM_ClientAttestation_016_UF
  variants: [SD+PA+E]
  basis: profile
  finding: >-
    The non-qualified EAA tenant (revokeWithWalletUnit off, ICS-07 No) issues default_credential_A with an expiry after
    the WIA's client_status.exp. EUDIPLO bounds the expiry only for configurations that chain revocation, by design
    since EUDIPLO/eudiplo#1634: the TS3 1.5 section 2.4.3 rule (ISSU_12c) is a PID rule, so the test case is arguably
    PID only for a Provider that does not chain
  reference: EUDIPLO/eudiplo#1622
