- testCase: AP_WS_SM_ProofOfPossession_002_UF
  variants: [SD+PA+Q, SD+PA+PB, SD+PA+E]
  finding: >-
    As PP_WS_SM_ProofOfPossession_002_UF (the same behaviour for default_credential_A): A key proof with alg none is
    refused with invalid_credential_request instead of invalid_proof (OpenID4VCI 1.0 section 8.3.1.2); HS256 and ES256K
    get invalid_proof
- testCase: AP_WS_SM_ProofOfPossession_007_UF
  variants: [SD+AC+Q, SD+AC+PB, SD+AC+E]
  finding: >-
    As PP_WS_SM_ProofOfPossession_007_UF (the same behaviour for default_credential_A): In the authorization code flow
    EUDIPLO issues the PID for a key proof whose iss is other-wallet-unit while the token was issued to client_id
    wallet-unit-cw-1 (credential endpoint HTTP 200). OpenID4VCI 1.0 Appendix F.1: iss MUST be the client_id of the
    Client making the Credential Request. EUDIPLO calls verifyCredentialRequestJwtProof without clientId
    (adapters/openid-credential-proof-verifier.ts at ae0792a), so the library never compares iss.
  reference: >-
    not reported upstream; evidence in the reference run's artifacts
    PP_WS_SM_ProofOfPossession_007_UF/SD+AC/step-1/issuance.json
- testCase: AP_WS_SM_Revocation_100
