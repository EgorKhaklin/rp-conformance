# Issue 26: revocation chaining, PP_Inf, SM_IssuerIntegrity (found 2026-11-20 against 9.1.0-main.ae0792a)

# Upstream issue text: upstream-findings/wallet-attestation-status-claim.md (the existing finding of issue 19)
- testCase: PP_WS_SM_Revocation_006
  variants: [SD+PA, MD+PA]
  finding: >-
    No revocation chaining for a revoked Wallet Instance: the PID stays valid (0x00) in every poll for T_chain (7 min)
    after the Test Wallet Provider revoked the WIA's entry. EUDIPLO checks a WIA's status only at the token endpoint and
    reads it only from a top-level status claim, not from TS3's client_status.status ("Wallet attestation does not
    contain status claim"), and revokeWithWalletUnit follows the KA only
  reference: adapters/issuer-eudiplo/upstream-findings/wallet-attestation-status-claim.md (not yet reported upstream)

# Upstream issue text: upstream-findings/wallet-attestation-status-claim.md (the existing finding of issue 19)
- testCase: PP_WS_SM_Revocation_007
  variants: [SD+PA, MD+PA]
  finding: >-
    No revocation chaining for a revoked WSCD: the PID stays valid (0x00) in every poll for T_chain (7 min) after the
    Test Wallet Provider revoked the KA's entry. revokeWithWalletUnit records a wallet unit only from a KA's top-level
    status claim; a TS3 KA carries it in key_storage_status.status, so no wallet unit is recorded and the list of the
    KA is never fetched
  reference: adapters/issuer-eudiplo/upstream-findings/wallet-attestation-status-claim.md (not yet reported upstream)

# Upstream issue text: upstream-findings/sd-jwt-array-element-disclosure.md
- testCase: PP_WS_SM_IssuerIntegrity_005
  variants: [SD+PA]
  finding: >-
    The elements of an array claim are not selectively disclosable one by one: nationalities is one disclosure as a
    whole (selective-disclosure: "nationalities[0] is not an array element disclosure"); buildDisclosureFrame turns an
    element path into a string key, which @sd-jwt/core never matches to an array index
  reference: adapters/issuer-eudiplo/upstream-findings/sd-jwt-array-element-disclosure.md (not yet reported upstream)

# Upstream issue text: upstream-findings/sd-jwt-salt-length.md
- testCase: PP_WS_SM_IssuerIntegrity_006
  variants: [SD+PA]
  finding: >-
    SD-JWT VC disclosure salts carry 64 bits (16 hexadecimal characters from @owf/crypto generateSalt(16)), below the
    128 bits of RFC 9901 section 9.3; the mdoc random values (32 bytes) pass
  reference: adapters/issuer-eudiplo/upstream-findings/sd-jwt-salt-length.md (not yet reported upstream)

# Upstream issue text: upstream-findings/trust-list-last-known-good.md
- testCase: PP_Inf_SM_TrustMechanisms_004_UF
  variants: [SD+PA, MD+PA, SD+AC, MD+AC]
  finding: >-
    A TL-WP version with a broken seal, or sealed under CA-X, is refused, but EUDIPLO keeps no last valid list: after
    the refresh every token request fails with 401 invalid_client "Wallet provider trust lists could not be loaded"
    (PA), every pushed authorization request with 400 invalid_client "Client attestation validation failed" (AC),
    instead of the previous list applying
  reference: adapters/issuer-eudiplo/upstream-findings/trust-list-last-known-good.md (not yet reported upstream)
# Issue 20: authorization code and pre-authorized code.
- testCase: PP_WS_IA_AuthorizationCode_006_UF
  variants: [SD+AC]
  finding: >-
    An unknown scope is not rejected. Step 2 pushes an authorization request with scope=unknown-scope (no
    authorization_details) and the offer's issuer_state: PAR answers 201 with a request_uri, the authorization endpoint
    redirects with a code, the token response carries authorization_details for pid-sd-jwt-vc that the wallet never
    requested, and the credential endpoint issues the PID (HTTP 200). EUDIPLO validates no scope at PAR
    (assertValidPushedAuthorizationRequest) and grants the offer's configurations when the request names none it knows
    (authorizationDetailsForToken falls back to the offer, domain/token-grant-rules.ts at ae0792a). RFC 6749 section 3.3
    lets an Authorization Server ignore part of a scope, but then the token response must carry the granted scope; the
    catalogue requires the rejection (OpenID4VCI 1.0 section 5.1.2). Step 1 (unknown credential_configuration_id in
    authorization_details) passes: the token covers only the unknown configuration and the credential request for the
    PID is rejected with invalid_credential_request.
  reference: >-
    not reported upstream; evidence in the reference run's artifacts
    PP_WS_IA_AuthorizationCode_006_UF/SD+AC/step-2/issuance.json
# Issue 20 makes the AC variants of other areas executable (P-AC).
- testCase: PP_WS_SM_ProofOfPossession_007_UF
  variants: [SD+AC]
  finding: >-
    In the authorization code flow EUDIPLO issues the PID for a key proof whose iss is other-wallet-unit while the
    token was issued to client_id wallet-unit-cw-1 (credential endpoint HTTP 200). OpenID4VCI 1.0 Appendix F.1: iss
    MUST be the client_id of the Client making the Credential Request. EUDIPLO calls verifyCredentialRequestJwtProof
    without clientId (adapters/openid-credential-proof-verifier.ts at ae0792a), so the library never compares iss.
  reference: >-
    not reported upstream; evidence in the reference run's artifacts
    PP_WS_SM_ProofOfPossession_007_UF/SD+AC/step-1/issuance.json


# None of these is reported upstream by this suite (no issues in EUDIPLO/eudiplo from here); `reference` names the
