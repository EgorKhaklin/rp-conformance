# AP_* objectives from 100 (ARF Annex 2, TS3).
- testCase: AP_WS_MS_Metadata_008
  variants: [Q, PB, E]
  basis: profile
  finding: >-
    The configuration with keyBinding false advertises the proof types jwt and attestation without
    key_attestations_required (metadata-key-attestation); the device-bound configurations pass
  reference: upstream-findings/key-binding-false.md
- testCase: AP_WS_MS_Metadata_100
  variants: [Q, PB, E]
  basis: profile
  finding: >-
    A configuration with keyBinding false is published with cryptographic_binding_methods_supported ["jwk"] and the
    proof types jwt and attestation, so no configuration states that it needs no key attestation (WUA_10a)
  reference: upstream-findings/key-binding-false.md
- testCase: AP_WS_MS_Metadata_101
  variants: [Q, PB, E]
  basis: profile
  finding: >-
    The configuration with keyBinding false is published with proof types but without key_attestations_required, though
    its cryptographic_binding_methods_supported makes it a device-bound configuration
  reference: upstream-findings/key-binding-false.md
- testCase: AP_WS_SM_KeyAttestation_102
  variants: [SD+PA+Q, SD+PA+PB, SD+PA+E]
  basis: profile
  finding: >-
    A credential request without proofs for the configuration with keyBinding false is rejected with HTTP 400
    invalid_proof ("The proofs parameter is missing"): the attestation that is not device-bound cannot be obtained with
    the WIA only (WUA_10a). With a proof it is issued without cnf
  reference: upstream-findings/key-binding-false.md
- testCase: AP_WS_SM_KeyAttestation_103
  variants: [SD+PA+Q, SD+PA+PB, SD+PA+E]
  basis: profile
  finding: >-
    The valid step (no proofs, configuration with keyBinding false) is rejected with invalid_proof, as in
    AP_WS_SM_KeyAttestation_102; the revoked Wallet Instance stimulus is answered with an attestation, as
    PP_WS_SM_ClientAttestation_012_UF
  reference: upstream-findings/key-binding-false.md, upstream-findings/wallet-attestation-status-claim.md
- testCase: AP_WS_SM_Revocation_100
  variants: [MD+PA+Q, SD+PA+Q, MD+PA+PB, SD+PA+PB]
  basis: profile
  finding: >-
    The QEAA and PuB-EAA tenants declare revocation chaining (ICS-07 Yes, revokeWithWalletUnit true), but the
    attestation stays valid (0x00) in every poll for T_chain after the Test Wallet Provider revoked the Wallet Instance,
    as PP_WS_SM_Revocation_006
  reference: upstream-findings/wia-revocation-chaining.md, upstream-findings/wallet-attestation-status-claim.md
- testCase: AP_WS_SM_Revocation_102
  variants: [SD+PA+Q]
  basis: profile
  finding: >-
    After the embedded disclosure policy of the configuration changed (PATCH /api/issuer/credentials/{id}, confirmed by
    GET), the attestation issued under the old policy stays valid (0x00) in every poll for T_rev (EDP_11)
  reference: upstream-findings/disclosure-policy-change.md
