    status claim - skipping status check"), so no WIA status is checked at the refresh grant either.
  reference: >-
    trust/status-list-verifier.service.ts getStatusEntryFromJwt (decodeJwt(jwt).status); issue 19 records the same cause
    for ClientAttestation_012_UF
- testCase: AP_WS_MS_Metadata_008
  variants: [Q, PB, E]
  finding: >-
    The configuration with keyBinding false advertises the proof types jwt and attestation without
    key_attestations_required (metadata-key-attestation); the device-bound configurations pass
  reference: >-
    adapters/issuer-eudiplo/upstream-findings/key-binding-false.md (not yet reported upstream)
- testCase: AP_WS_MS_Metadata_100
  variants: [Q, PB, E]
  finding: >-
    A configuration with keyBinding false is published with cryptographic_binding_methods_supported ["jwk"] and the
    proof types jwt and attestation, so no configuration states that it needs no key attestation (WUA_10a)
  reference: >-
    adapters/issuer-eudiplo/upstream-findings/key-binding-false.md (not yet reported upstream)
- testCase: AP_WS_MS_Metadata_101
  variants: [Q, PB, E]
  finding: >-
    The configuration with keyBinding false is published with proof types but without key_attestations_required, though
    its cryptographic_binding_methods_supported makes it a device-bound configuration
  reference: >-
    adapters/issuer-eudiplo/upstream-findings/key-binding-false.md (not yet reported upstream)
- testCase: AP_WS_SH_Encoding_002_UF
  variants: [SD+PA+Q, SD+PA+PB, SD+PA+E]
  finding: >-
    As PP_WS_SH_Encoding_002_UF (the same behaviour for default_credential_A): A credential request of 10 MiB is
    answered HTTP 413 without an OAuth or OpenID4VCI error object (body parser limit 10 MB, Nest error body). A
    credential request with an extra member nested 10 000 levels deep is accepted and the PID issued: the member is
    parsed and ignored. EUDIPLO stays available (step 3 passes).
  reference: >-
    main.helpers.ts (lines 20-28, json limit 10mb); all-exceptions.filter.ts (lines 44-50)
- testCase: AP_WS_SH_Encoding_003_UF
  variants: [SD+PA+Q, SD+PA+PB, SD+PA+E]
  finding: >-
    As PP_WS_SH_Encoding_003_UF (the same behaviour for default_credential_A): A jku or x5u header in the WIA or KA, or
    a jku header in the key proof, is ignored and the PID issued; the URLs are not fetched (NOFETCH passes in every
    step), and a kid URL in the proof is rejected (invalid_proof). The catalogue expects such a request to be rejected
    (RFC 8725 section 3.10).
  reference: >-
    crypto/crypto.service.ts (lines 124-127, only jwk and x5c signers)
- testCase: AP_WS_SH_Encoding_004_UF
  variants: [SD+PA+Q, SD+PA+PB, SD+PA+E]
  finding: >-
    As PP_WS_SH_Encoding_004_UF (the same behaviour for default_credential_A): A WIA or KA whose validly signed status
    reference points to http://169.254.169.254/... is accepted and the PID issued. EUDIPLO reads the status reference
    from the claim status.status_list only, while TS3 (and the Test Wallet Provider) carry it in client_status and
    key_storage_status: its log says "Wallet attestation does not contain status claim - skipping status check" for
    every issuance, so no WIA or KA status is checked at all. The CA-X cases (steps 1 and 2) are rejected without
    fetching.
  reference: >-
    trust/wallet-attestation.service.ts (lines 306-485 at HEAD 0aefcb2, unchanged since ae0792a)
- testCase: AP_WS_SH_Encoding_005_UF
  variants: [SD+PA+Q, SD+PA+PB, SD+PA+E]
  finding: >-
    As PP_WS_SH_Encoding_005_UF (the same behaviour for default_credential_A): With SL-WP-A served as a Status List
    Token whose lst inflates to 1 GiB (status-list.decompression-bomb), EUDIPLO issues the PID without requesting the
    list (0 requests during the step): it never reads the WIA or KA status (see Encoding_004_UF), so how it handles a
    decompression bomb cannot be observed. The test case stays a FAIL until EUDIPLO checks the status of a TS3 WIA and
    KA; EUDIPLO stays available (the later test cases of the run pass).
  reference: >-
    trust/status-list-verifier.service.ts getStatusEntryFromJwt; trust/wallet-attestation.service.ts ("does not contain
    status claim - skipping status check")
- testCase: AP_WS_SM_ClientAttestation_006_UF
  variants: [SD+PA+Q, SD+PA+PB, SD+PA+E]
  finding: >-
    As PP_WS_SM_ClientAttestation_006_UF (the same behaviour for default_credential_A): EUDIPLO accepts a WIA signed
    under WP-A's KA CA (TL-WP service "WP-A WSCD"): it matches the signer against every Wallet Solution issuance service
    of the entity, not the one named by the WIA's wallet_name (TS3 section 3.2)
- testCase: AP_WS_SM_ClientAttestation_009_UF
  variants: [SD+PA+Q, SD+PA+PB, SD+PA+E]
  finding: >-
    As PP_WS_SM_ClientAttestation_009_UF (the same behaviour for default_credential_A): EUDIPLO accepts a client
    attestation PoP whose jti it accepted in an earlier token request of the same Wallet Unit (step 4); it keeps a jti
    store for DPoP proofs only
- testCase: AP_WS_SM_ClientAttestation_012_UF
  variants: [SD+PA+Q, SD+PA+PB, SD+PA+E]
  finding: >-
    As PP_WS_SM_ClientAttestation_012_UF (the same behaviour for default_credential_A): EUDIPLO issues a PID for a
    revoked Wallet Instance: it reads a WIA's status only from a top-level status claim, not from TS3's
    client_status.status, and skips the check ("Wallet attestation does not contain status claim")
- testCase: AP_WS_SM_ClientAttestation_013_UF
  variants: [SD+PA+Q, SD+PA+PB, SD+PA+E]
  finding: >-
    As PP_WS_SM_ClientAttestation_013_UF (the same behaviour for default_credential_A): EUDIPLO issues a PID when the
    WIA's status list is unreachable or a bad Status List Token (every stimulus): it never fetches the list of a TS3 WIA
    (client_status.status is not read)
- testCase: AP_WS_SM_ClientAttestation_016_UF
  variants: [SD+PA+Q, SD+PA+PB, SD+PA+E]
  finding: >-
    As PP_WS_SM_ClientAttestation_016_UF (the same behaviour for default_credential_A): A WIA whose maintenance period
    ends tomorrow is neither rejected nor does it shorten the PID, which expires in 30 days
- testCase: AP_WS_SM_IssuerIntegrity_006
  variants: [SD+PA+Q, SD+PA+PB, SD+PA+E]
  finding: >-
    As PP_WS_SM_IssuerIntegrity_006 (the same behaviour for default_credential_A): SD-JWT VC disclosure salts carry 64
    bits (16 hexadecimal characters from @owf/crypto generateSalt(16)), below the 128 bits of RFC 9901 section 9.3; the
    mdoc random values (32 bytes) pass
  reference: >-
    adapters/issuer-eudiplo/upstream-findings/sd-jwt-salt-length.md (not yet reported upstream)
- testCase: AP_WS_SM_KeyAttestation_004_UF
  variants: [SD+PA+Q, SD+PA+PB, SD+PA+E]
  finding: >-
    As PP_WS_SM_KeyAttestation_004_UF (the same behaviour for default_credential_A): EUDIPLO accepts a KA signed under
    WP-A's WIA CA (TL-WP service "WP-A Wallet"), stimulus (d); the stimuli CA-X, PP-A and WP-W are rejected
- testCase: AP_WS_SM_KeyAttestation_007_UF
  variants: [SD+PA+Q, SD+PA+PB, SD+PA+E]
  finding: >-
    As PP_WS_SM_KeyAttestation_007_UF (the same behaviour for default_credential_A): In a jwt proof, EUDIPLO accepts a
    KA whose nonce is the c_nonce of another session, or which has no nonce (OpenID4VCI 1.0 Appendix F.1, F.4); as the
    attestation proof type a KA without nonce is rejected
- testCase: AP_WS_SM_KeyAttestation_008_UF
  variants: [SD+PA+Q, SD+PA+PB, SD+PA+E]
  finding: >-
    As PP_WS_SM_KeyAttestation_008_UF (the same behaviour for default_credential_A): EUDIPLO issues a PID for a revoked
    WSCD: it reads a KA's status only from a top-level status claim, not from TS3's key_storage_status.status, and skips
    the check ("Key attestation does not contain status claim")
- testCase: AP_WS_SM_KeyAttestation_009_UF
  variants: [SD+PA+Q, SD+PA+PB, SD+PA+E]
  finding: >-
    As PP_WS_SM_KeyAttestation_009_UF (the same behaviour for default_credential_A): EUDIPLO issues a PID when the KA's
    status list is unreachable or a bad Status List Token (every stimulus): it never fetches the list of a TS3 KA
    (key_storage_status.status is not read)
- testCase: AP_WS_SM_KeyAttestation_102
  variants: [SD+PA+Q, SD+PA+PB, SD+PA+E]
  finding: >-
    A credential request without proofs for the configuration with keyBinding false is rejected with HTTP 400
    invalid_proof ("The proofs parameter is missing"): the attestation that is not device-bound cannot be obtained with
    the WIA only (WUA_10a). With a proof it is issued without cnf
